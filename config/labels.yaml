# Label scheme for CICIoT2023 (per-pcap CSV release, 309 files).
#
# Label    = name of the folder the source CSV came from (the files have no label column).
#            Folder "Benign_Final" is labelled "BenignTraffic".
# Category = attack family. 33 attacks in 7 families plus benign.
#
# Status: the folder names were read from the files. The family of each attack follows
# Neto et al., Sensors 23(13):5941, 2023: its abstract names the seven categories DDoS, DoS,
# Recon, Web-based, brute force, spoofing and Mirai (checked in Step 1, A02).

# Label schemes used in the experiments (Step 3, decision D-016):
#   L34  the 34 original labels
#   L8   the 8 categories below (main task)
#   L2   benign vs attack
#   LM   L34 with the flood labels merged that share feature vectors heavily (rule below);
#        the groups are computed by scripts/03_label_schemes.py from the Step 2 audit
merge_rule:
  # Two labels are linked when at least this share of the rows of either label has a feature
  # vector that also occurs under the other label; linked labels are merged (connected groups).
  min_shared_share: 0.10
  # Merged groups are named after the shared attack type, e.g. "TCP_Flood (DDoS+DoS)".

categories:
  Benign:
    - BenignTraffic
  DDoS:
    - DDoS-ACK_Fragmentation
    - DDoS-HTTP_Flood
    - DDoS-ICMP_Flood
    - DDoS-ICMP_Fragmentation
    - DDoS-PSHACK_FLOOD
    - DDoS-RSTFINFLOOD
    - DDoS-SYN_Flood
    - DDoS-SlowLoris
    - DDoS-SynonymousIP_Flood
    - DDoS-TCP_Flood
    - DDoS-UDP_Flood
    - DDoS-UDP_Fragmentation
  DoS:
    - DoS-HTTP_Flood
    - DoS-SYN_Flood
    - DoS-TCP_Flood
    - DoS-UDP_Flood
  Mirai:
    - Mirai-greeth_flood
    - Mirai-greip_flood
    - Mirai-udpplain
  Recon:
    - Recon-HostDiscovery
    - Recon-OSScan
    - Recon-PingSweep
    - Recon-PortScan
    - VulnerabilityScan
  Spoofing:
    - DNS_Spoofing
    - MITM-ArpSpoofing
  Web:
    - Backdoor_Malware
    - BrowserHijacking
    - CommandInjection
    - SqlInjection
    - Uploading_Attack
    - XSS
  BruteForce:
    - DictionaryBruteForce
